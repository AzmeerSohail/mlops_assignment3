services:
  sleek-airflow:
    build: .                     # 👈 Tells Docker to build from Dockerfile in current dir
    image: sleek-airflow:latest # 👈 Tag the local image
    volumes:
       - ./airflow/airflow.cfg:/opt/airflow/airflow.cfg
       - ./airflow:/opt/airflow
    ports:
      - "8081:8080"
    command: airflow standalone
